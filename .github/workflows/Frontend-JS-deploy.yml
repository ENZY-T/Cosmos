name: Frontend-Js Deployment

on:
  # workflow_dispatch
  push:
    branches: [Frontend-dev-js]

jobs:
  build:
    runs-on: ubuntu-20.04

    strategy:
      matrix:
        node-version: [16.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checking out branch
        uses: actions/checkout@v2
        with:
          ref: 'Frontend-dev-js'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm i --force

      - name: Build for production
        run: |
          CI=false npm run build --if-present
          echo "============================"
          ls -lrt ./build

      - name: Copy to deployment server via scp
        uses: garygrossgarten/github-action-scp@0.9.0
        with:
          local: ./build/
          remote: /var/www/html
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          privateKey: ${{ secrets.HOST_PRIVATE_KEY }}
          verbose: true
          concurrency: 500
          rmRemote: true

      - name: Set permissions and Restart nginx
        uses: garygrossgarten/github-action-ssh@v0.3.0
        with:
          command: |
            chown -R www-data:www-data /var/www/html
            nginx -s reload

          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          privateKey: ${{ secrets.HOST_PRIVATE_KEY }}
